name: CI

on:
  push:
    branches:
      - main
      - "curation/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Qualification claim lint
        run: python -m qualification.claim_lint
      - name: Test
        run: python -m pytest -q
      - name: Acceptance smoke
        run: python qualification/uow_system_acceptance.py --step-programs 2 --steps-per-program 2 --terminating-runs 2 --timing-seeds 10 --output /tmp/uow_acceptance_smoke.txt

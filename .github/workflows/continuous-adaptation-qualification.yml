name: Continuous Adaptation Qualification

on:
  pull_request:
    paths:
      - "qualification/embedded/esp32_dual_core/**"
      - ".github/workflows/continuous-adaptation-qualification.yml"
  push:
    branches:
      - "qualification/continuous-adaptation-v1"
    paths:
      - "qualification/embedded/esp32_dual_core/**"
      - ".github/workflows/continuous-adaptation-qualification.yml"

jobs:
  host-adaptation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "openvino>=2026.0,<2027" onnx onnxscript numpy pytest pyserial

      - name: Run adaptive host qualification
        working-directory: qualification/embedded/esp32_dual_core/host
        run: |
          python -m pytest -q \
            test_interrogator.py \
            test_external_proposer.py \
            test_router_campaign.py \
            test_stochastic_environment.py \
            test_concurrency_pipeline.py \
            test_endurance_metrics.py

  portable-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run portable C++ qualification
        run: |
          cmake -S qualification/embedded/esp32_dual_core/host -B /tmp/uow-esp32-host
          cmake --build /tmp/uow-esp32-host --parallel
          /tmp/uow-esp32-host/uow_embedded_tests

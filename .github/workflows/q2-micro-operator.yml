name: Q2 Micro Operator
on:
  push:
    branches:
      - experiment/q2-probabilistic-micro-operator
  pull_request:
    paths:
      - 'qualification/micro_operator/**'
      - 'tests/test_q2_micro_operator.py'
      - '.github/workflows/q2-micro-operator.yml'
jobs:
  q2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Q2 unit and integrated authority tests
        run: python -m pytest -q tests/test_q2_micro_operator.py
      - name: Q2 qualification report
        run: python -m qualification.micro_operator.q2_campaign

name: UoW Closure Shadow

on:
  push:
    branches:
      - "research/uow-closure-architecture"
      - "architecture/uow-staged-relocation"
  pull_request:
    branches:
      - main
    paths:
      - "architecture/**"
      - "src/uow/**"
      - "specification/**"
      - "implementations/**"
      - "realizations/**"
      - "experiments/**"
      - "qualification/**"
      - ".github/workflows/uow-closure-shadow.yml"

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install canonical package and pytest
        run: python -m pip install -e . pytest
      - name: Shadow semantic tests
        run: python -m pytest -q architecture/shadow/python/tests

      - name: Post-A3 P1-P5 policy API suite
        run: >
          python -m pytest -q
          tests/test_policy_orchestrator.py
          tests/test_p1_end_to_end_orchestration.py
          tests/test_p2_live_policy_promotion.py
          tests/test_p3_live_drift_and_requalification.py
          tests/test_p4_distributed_policy_authority.py
          tests/test_p5_durable_recovery.py

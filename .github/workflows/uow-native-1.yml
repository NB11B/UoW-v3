name: UOW-NATIVE-1 isolated checks

on:
  pull_request:
    paths:
      - "experiments/uow_native_1/**"
      - ".github/workflows/uow-native-1.yml"
  push:
    branches:
      - "research/uow-native-1-goodfire-pilot"
    paths:
      - "experiments/uow_native_1/**"
      - ".github/workflows/uow-native-1.yml"
  workflow_dispatch:

jobs:
  experiment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all experiment modules
        run: python -m compileall -q experiments/uow_native_1
      - name: Test intervention and controls
        working-directory: experiments/uow_native_1
        run: python -m unittest -v test_pretrained_probe test_stage2_controls test_experiment

name: UOW-NATIVE-3 spectral checks
on:
  push:
    branches:
      - research/uow-native-3-lora-causal-mechanisms
  pull_request:
    paths:
      - "experiments/uow_native_3/**"
      - ".github/workflows/uow-native-3.yml"
jobs:
  spectral-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax compilation
        run: python -m compileall -q experiments/uow_native_3
      - name: Test rank reconstruction
        run: python -m unittest discover -s experiments/uow_native_3/tests -v

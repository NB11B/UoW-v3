      - tests/test_orchestration.py
    archive_commit: e9a143568180e612809dabd1352b023079c5001c

requires:
  axioms: [A0, A1, A2, A3, A4, A5, A6]
  capabilities:
    - queue as authoritative state
    - scheduler as ordinary UoW
    - completion as ordinary UoW
    - nested orchestration
    - deadlock detection
    - crash/resume from committed state and evidence

    expected: deterministic halt/deadlock state
  - id: independent-reference-scheduler
    expected: same authoritative result as self-hosted scheduler

evidence:
  minimum_level: PORTABLE
  preserve_archive_campaign: true

assertions:
  - scheduler decisions have no privileged mutation path
  - orchestration control state participates in authoritative state identity
  - self-hosted and reference orchestration produce equivalent result

reconstruction:

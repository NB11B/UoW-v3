  preserve_archive_campaign: true
  preservation_class: [P0, P1, P2, P3]

assertions:
  - concurrent committed history is equivalent to a legal sequential history
  - rejected transactions cause no partial authoritative mutation
  - OCC semantics alone must not be mistaken for preservation of every archived concurrent execution realization


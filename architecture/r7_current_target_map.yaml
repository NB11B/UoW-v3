schema_version: "0.1"
status: R7_0_CURRENT_TARGET_MAP
production_moves: false

actions:
  KEEP_AND_FACADE: existing implementation remains; future semantic facade wraps/exposes it
  MOVE_LATER: candidate for structural relocation only after dual-layout parity
  RETAIN_REALIZATION: preserve as distinct implementation
  RETAIN_EVIDENCE: preserve as qualification/archive evidence
  COMPATIBILITY_SHIM: preserve old import path/API after future relocation
  SPEC_SOURCE: semantic content informs language-neutral specification


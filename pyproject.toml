[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uow"
version = "0.1.0.dev0"
description = "Typed, certifiable Unit-of-Work transition primitives"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.optional-dependencies]
semantic-hf = [
    "torch",
    "transformers",
    "peft",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

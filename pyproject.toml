[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uow"
version = "3.1.0"
description = "Typed, certifiable Unit-of-Work transition primitives for UoW v3.1"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
uow = "uow.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uow*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


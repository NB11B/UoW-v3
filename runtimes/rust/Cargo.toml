[package]
name = "uow-runtime"
version = "3.1.0"
edition = "2021"
authors = ["UoW Architecture Team"]
description = "Independent Rust Native Runtime for Unit-of-Work (UoW) Levels 0-2"

[dependencies]
uow-core = { path = "../../sdk/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "conformance_runner"
path = "src/bin/conformance_runner.rs"

[lib]
name = "uow_runtime"
path = "src/lib.rs"

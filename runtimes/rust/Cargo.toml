[package]
name = "uow-core"
version = "1.0.0"
edition = "2021"
authors = ["Google DeepMind / UoW Architecture Team"]
description = "Canonical Rust Native SDK and Execution Engine for Unit-of-Work (UoW) v2.0"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"

[features]
default = ["std"]
std = []
no_std = []

[[example]]
name = "inventory_reserve"
path = "../../examples/rust/main.rs"

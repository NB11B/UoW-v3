[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uow-sdk"
version = "1.0.0"
description = "Typed Python Client SDK for the UoW Capability Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["uow*"]
